<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lebah Bergerak - Leaderboard</title>
    
<link rel="icon" href="icons/icon-192.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --pkb-green: #03754c; --pkb-orange: #FF9c08; --pkb-yellow: #fff212; --pkb-white: #fefefe; --pkb-black: #000000; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--pkb-green); color: var(--pkb-black); padding-bottom: 30px; }
        
        .app-header { background-color: var(--pkb-green); color: var(--pkb-yellow); padding: 15px 20px; text-align: center; font-size: 20px; font-weight: bold; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid rgba(255,242,18,0.3); box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; }
        .btn-back { color: var(--pkb-white); font-size: 16px; cursor: pointer; background: rgba(0,0,0,0.2); padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        
        .form-card { background-color: var(--pkb-white); border-radius: 15px; padding: 25px 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        
        /* Gaya Khusus Leaderboard */
        .rank-list { list-style: none; padding: 0; margin-top: 20px; }
        .rank-item { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; margin-bottom: 10px; padding: 15px; border-radius: 12px; border-left: 5px solid #ddd; transition: transform 0.2s; }
        .rank-item:active { transform: scale(0.98); }
        
        .rank-number { font-size: 20px; font-weight: bold; width: 30px; color: #888; }
        .rank-info { flex: 1; padding-left: 10px; }
        .rank-name { font-weight: bold; font-size: 15px; color: var(--pkb-green); text-transform: uppercase; }
        .rank-poin { font-weight: bold; font-size: 18px; color: var(--pkb-orange); }
        
        /* Warna Khusus Top 3 */
        .rank-item.top-1 { border-left-color: #FFD700; background: linear-gradient(to right, #fffdf0, #ffffff); } /* Emas */
        .rank-item.top-1 .rank-number { color: #FFD700; font-size: 24px; }
        
        .rank-item.top-2 { border-left-color: #C0C0C0; background: linear-gradient(to right, #f8f9fa, #ffffff); } /* Perak */
        .rank-item.top-2 .rank-number { color: #C0C0C0; font-size: 22px; }
        
        .rank-item.top-3 { border-left-color: #CD7F32; background: linear-gradient(to right, #fdf5ef, #ffffff); } /* Perunggu */
        .rank-item.top-3 .rank-number { color: #CD7F32; font-size: 20px; }
        
        .shimmer { text-align: center; color: #888; font-style: italic; padding: 20px; }
        .rank-sub { font-size: 11px; color: #777; margin-top: 3px; line-height: 1.4; }
        .rank-me { outline: 2px solid var(--pkb-orange); }
        .badge-anda { display: inline-block; background: var(--pkb-orange); color: #fff; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-header">
        <div class="btn-back" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-arrow-left"></i> Kembali</div>
        <div style="width: 80px;"></div>
    </div>

    <div class="container">
        <div class="form-card">
            <div style="text-align: center; margin-bottom: 10px;">
                <i class="fa-solid fa-ranking-star" style="font-size: 45px; color: var(--pkb-orange);"></i>
                <h3 style="color: var(--pkb-green); margin-top: 10px; text-transform: uppercase;">Papan Peringkat</h3>
                <p style="font-size: 12px; color: #666;">Top 10 Kader Lebah Bergerak dengan akumulasi Poin Kerja, Poin Kreatif, dan Poin Konekta.</p>
            </div>

            <ul class="rank-list" id="leaderboard_container">
                <div class="shimmer"><i class="fa-solid fa-spinner fa-spin"></i> Menarik data dari pusat...</div>
            </ul>
        </div>
    </div>

    <script>
        // ================= KREDENSIAL SUPABASE =================
        const SUPABASE_URL = "https://hvbrskchlpemypawpqjn.supabase.co/rest/v1";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2YnJza2NobHBlbXlwYXdwcWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzYzNzksImV4cCI6MjA5MjUxMjM3OX0.0NCroyTHROeQ3SNKOTNZS1H1hxrGy5wGTLGWm5YdOdo"; 

        const headersConfig = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
        };

        // ================= TARIK RANKING DARI SUPABASE =================
        function angka(n) { return Number(n || 0).toLocaleString('id-ID'); }

        window.onload = function() {
            const kaderData = localStorage.getItem('lebah_kader_data');

            if(!kaderData) {
                window.location.href = "index.html";
                return;
            }
            const me = JSON.parse(kaderData || '{}');
            const container = document.getElementById('leaderboard_container');

            const queryUrl = `${SUPABASE_URL}/master_kader?select=id_kader,nama,saldo_poin,creative_balance,konekta_points&limit=300`;

            fetch(queryUrl, { method: 'GET', headers: headersConfig })
            .then(res => res.json())
            .then(data => {
                container.innerHTML = '';

                const rows = (Array.isArray(data) ? data : []).map(k => {
                    const kerja = Number(k.saldo_poin || 0);
                    const kreatif = Number(k.creative_balance || 0);
                    const konekta = Number(k.konekta_points || 0);
                    return { id: k.id_kader, nama: k.nama || 'Tanpa Nama', kerja, kreatif, konekta, total: kerja + kreatif + konekta };
                }).sort((a, b) => b.total - a.total || a.nama.localeCompare(b.nama));

                if(!rows.length) {
                    container.innerHTML = '<div class="shimmer">Belum ada data kader yang masuk peringkat.</div>';
                    return;
                }

                const posisiSaya = rows.findIndex(r => r.id === me.id_kader);

                rows.slice(0, 10).forEach((kader, index) => {
                    let rankClass = '';
                    let icon = '';
                    if(index === 0) { rankClass = 'top-1'; icon = '<i class="fa-solid fa-crown" style="color: #FFD700; font-size: 12px; margin-left: 5px;"></i>'; }
                    else if(index === 1) { rankClass = 'top-2'; }
                    else if(index === 2) { rankClass = 'top-3'; }
                    const saya = kader.id === me.id_kader ? ' rank-me' : '';
                    const badge = kader.id === me.id_kader ? '<span class="badge-anda">ANDA</span>' : '';

                    const itemHtml = `
                        <li class="rank-item ${rankClass}${saya}">
                            <div class="rank-number">#${index + 1}</div>
                            <div class="rank-info">
                                <div class="rank-name">${kader.nama} ${icon}${badge}</div>
                                <div class="rank-sub">Kerja ${angka(kader.kerja)} | Kreatif ${angka(kader.kreatif)} | Konekta ${angka(kader.konekta)}</div>
                            </div>
                            <div class="rank-poin">${angka(kader.total)} <span style="font-size: 10px; color: #aaa;">Poin</span></div>
                        </li>
                    `;
                    container.innerHTML += itemHtml;
                });

                if(posisiSaya >= 10) {
                    const s = rows[posisiSaya];
                    container.innerHTML += `
                        <li class="rank-item rank-me" style="margin-top: 14px;">
                            <div class="rank-number">#${posisiSaya + 1}</div>
                            <div class="rank-info">
                                <div class="rank-name">${s.nama} <span class="badge-anda">ANDA</span></div>
                                <div class="rank-sub">Kerja ${angka(s.kerja)} | Kreatif ${angka(s.kreatif)} | Konekta ${angka(s.konekta)}</div>
                            </div>
                            <div class="rank-poin">${angka(s.total)} <span style="font-size: 10px; color: #aaa;">Poin</span></div>
                        </li>`;
                }
            })
            .catch(err => {
                container.innerHTML = '<div class="shimmer" style="color: red;">Gagal memuat papan peringkat. Periksa koneksi internet.</div>';
                console.error(err);
            });
        };
    </script>
</body>
</html>
