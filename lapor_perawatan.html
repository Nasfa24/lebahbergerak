<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lebah Bergerak - Lapor Perawatan</title>
    
    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f41d.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #03754c; --secondary: #FF9c08; --accent: #fff212; --bg: #f3f4f6; --surface: #ffffff; --text: #1f2937; --text-light: #6b7280; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; -webkit-tap-highlight-color: transparent; }
        
        .app-header { background-color: var(--primary); color: var(--accent); padding: 15px 20px; text-align: center; font-size: 18px; font-weight: 800; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 12px rgba(3, 117, 76, 0.2); display: flex; justify-content: space-between; align-items: center; }
        .btn-back { color: #ffffff; font-size: 14px; cursor: pointer; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 6px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3); transition: background 0.2s; }
        .btn-back:active { background: rgba(255,255,255,0.3); }
        
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        
        .form-card { background-color: var(--surface); border-radius: 24px; padding: 30px 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); border: 1px solid #f3f4f6; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; color: var(--text); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        select { width: 100%; padding: 15px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; background-color: #f9fafb; transition: 0.3s; color: var(--text); }
        select:focus { outline: none; border-color: var(--primary); background-color: #ffffff; box-shadow: 0 0 0 4px rgba(3, 117, 76, 0.1); }
        
        .btn-submit { background-color: var(--primary); color: var(--accent); font-size: 16px; padding: 18px; width: 100%; border: none; border-radius: 16px; font-weight: 800; margin-top: 15px; text-transform: uppercase; cursor: pointer; box-shadow: 0 8px 20px rgba(3, 117, 76, 0.3); letter-spacing: 1px; transition: 0.2s; }
        .btn-submit:active { transform: scale(0.97); }
        .btn-submit:disabled { background-color: #9ca3af; cursor: not-allowed; box-shadow: none; transform: none; color: #f3f4f6;}
        
        .upload-box { border: 2px dashed #cbd5e1; border-radius: 16px; padding: 30px 20px; text-align: center; background: #f8fafc; transition: 0.3s; cursor: pointer; }
        .upload-box:active { background: #f1f5f9; }
        .upload-box.has-file { border-color: #10b981; background: #ecfdf5; }
        .upload-box i { font-size: 40px; color: #94a3b8; margin-bottom: 12px; transition: 0.3s;}
        .upload-box.has-file i { color: #10b981; }
        .upload-text { font-size: 14px; font-weight: 700; color: var(--text-light); }
        .upload-box.has-file .upload-text { color: #047857; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="btn-back" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-arrow-left"></i> Kembali</div>
        <div>PERAWATAN</div>
        <div style="width: 85px;"></div> 
    </div>

    <div class="container">
        <div class="form-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 72px; height: 72px; background: rgba(255, 156, 8, 0.1); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 15px;">
                    <i class="fa-solid fa-handshake-angle" style="font-size: 36px; color: var(--secondary);"></i>
                </div>
                <h3 style="color: var(--primary); font-weight: 800; font-size: 22px;">Laporan Perawatan</h3>
                <p style="font-size: 13px; color: var(--text-light); margin-top: 5px;">Laporkan giat Sapa Warga atau penyaluran Bantuan untuk mendapat +10 Poin.</p>
            </div>
            
            <form id="formPerawatan">
                <div class="form-group">
                    <label>Pilih Tokoh Binaan</label>
                    <select id="pilih_aktor" name="id_aktor" required>
                        <option value="">-- Menarik Data dari Pusat... --</option>
                    </select>
                    <p style="font-size: 11px; color: #ef4444; margin-top: 6px; font-weight: 600;">*Hanya menampilkan target yang sudah disetujui Admin.</p>
                </div>

                <div class="form-group">
                    <label>Jenis Kegiatan / Bantuan</label>
                    <select id="jenis_perawatan" name="jenis_perawatan" required>
                        <option value="">-- Pilih Jenis Kegiatan --</option>
                        <option value="Silaturahmi Rutin">Silaturahmi Rutin / Sapa Warga</option>
                        <option value="Distribusi Air Mineral">Distribusi Air Mineral</option>
                        <option value="Laundry Karpet/Mukena">Laundry Karpet / Mukena</option>
                        <option value="Penggantian Al-Quran">Penggantian Al-Quran</option>
                        <option value="Bantuan Lainnya">Bantuan Lainnya</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Foto Bukti Kegiatan (Wajib)</label>
                    <input type="file" id="foto_rawat_upload" accept="image/*" capture="environment" style="display: none;" onchange="previewFoto()">
                    <div class="upload-box" id="ui_upload_box" onclick="document.getElementById('foto_rawat_upload').click()">
                        <i class="fa-solid fa-camera-retro" id="ui_upload_icon"></i>
                        <div class="upload-text" id="ui_upload_text">Ketuk untuk Mengambil Foto Bukti</div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit-rawat">
                    <i class="fa-solid fa-paper-plane"></i> Kirim Laporan 
                </button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hvbrskchlpemypawpqjn.supabase.co/rest/v1";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2YnJza2NobHBlbXlwYXdwcWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzYzNzksImV4cCI6MjA5MjUxMjM3OX0.0NCroyTHROeQ3SNKOTNZS1H1hxrGy5wGTLGWm5YdOdo"; 
        const headersConfig = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

        window.onload = async function() {
            const kaderData = localStorage.getItem('lebah_kader_data');
            if(!kaderData) return window.location.href = "index.html";
            const user = JSON.parse(kaderData);
            
            const selectAktor = document.getElementById('pilih_aktor');
            
            try {
                const queryUrl = `${SUPABASE_URL}/master_pemilih?id_kader_pic=eq.${user.id_kader}&status_validasi=eq.Approved&select=nik,nama_lengkap,nama_institusi`;
                const res = await fetch(queryUrl, { method: 'GET', headers: headersConfig });
                const data = await res.json();
                
                selectAktor.innerHTML = '<option value="">-- Pilih Tokoh Binaan --</option>'; 
                
                if(data.length > 0) {
                    data.forEach(aktor => {
                        selectAktor.add(new Option(`${aktor.nama_lengkap} - ${aktor.nama_institusi || 'Warga Umum'}`, aktor.nik));
                    });
                } else {
                    Swal.fire({ icon: 'info', title: 'Data Kosong', text: 'Anda belum memiliki target binaan yang disetujui.', confirmButtonColor: '#03754c' })
                    .then(() => { window.location.href = "dashboard.html"; });
                }
            } catch(err) {
                selectAktor.innerHTML = '<option value="">-- Gagal memuat data --</option>';
                Swal.fire('Gangguan Jaringan', 'Gagal menarik data dari server.', 'error');
            }
        };

        function previewFoto() {
            const file = document.getElementById('foto_rawat_upload').files[0];
            const box = document.getElementById('ui_upload_box');
            if (file) {
                box.classList.add('has-file');
                document.getElementById('ui_upload_icon').className = "fa-solid fa-circle-check";
                document.getElementById('ui_upload_text').innerText = "Foto " + file.name + " siap dikirim!";
            }
        }

        document.getElementById('formPerawatan').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-rawat');
            const fileFoto = document.getElementById('foto_rawat_upload').files[0];

            if(!fileFoto) return Swal.fire('Tunggu Dulu', 'Foto bukti penyerahan/kegiatan wajib dilampirkan!', 'error');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim Laporan...';
            
            Swal.fire({ title: 'Menyinkronkan...', text: 'Mengunggah foto bukti ke server pusat', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            
            const kaderData = JSON.parse(localStorage.getItem('lebah_kader_data'));
            
            try {
                // 1. Upload Storage
                const namaFileUnik = `rawat_${Date.now()}_${Math.floor(Math.random() * 1000)}.jpg`;
                const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/foto_kegiatan/${namaFileUnik}`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': fileFoto.type }, body: fileFoto 
                });

                if(!uploadRes.ok) throw new Error("Gagal mengunggah foto.");
                const urlFotoPublik = `${SUPABASE_URL}/storage/v1/object/public/foto_kegiatan/${namaFileUnik}`;

                // 2. Insert DB
                const payload = {
                    id_kader: kaderData.id_kader,
                    id_aktor: document.getElementById('pilih_aktor').value,
                    jenis_perawatan: document.getElementById('jenis_perawatan').value,
                    url_foto_kegiatan: urlFotoPublik,
                    status: "Pending" 
                };

                const dbRes = await fetch(`${SUPABASE_URL}/log_perawatan`, { method: 'POST', headers: headersConfig, body: JSON.stringify(payload) });

                if (!dbRes.ok) throw new Error("Gagal menyimpan ke database.");

                await Swal.fire({ icon: 'success', title: 'Laporan Masuk!', text: 'Giat tercatat. Admin akan memvalidasi penambahan +10 Poin Anda.', confirmButtonColor: '#03754c' });
                window.location.href = "dashboard.html";

            } catch(error) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Laporan';
                Swal.fire({ icon: 'error', title: 'Gangguan Jaringan', text: 'Periksa koneksi internet Anda dan coba ulangi.', confirmButtonColor: '#FF9c08' });
            }
        });
    </script>
</body>
</html>
