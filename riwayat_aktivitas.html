<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Aktivitas - Lebah Bergerak</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f3f4f6; margin: 0; padding-bottom: 30px; }
        .header { background-color: #03754c; color: #fff212; padding: 18px; text-align: center; font-weight: 800; font-size: 18px; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 12px rgba(3, 117, 76, 0.2); }
        .container { padding: 16px 15px; max-width: 500px; margin: auto; }
        .ringkas { background: linear-gradient(135deg, #03754c, #025939); border-radius: 18px; padding: 16px; color: #fff; margin-bottom: 14px; box-shadow: 0 8px 18px rgba(3, 117, 76, 0.22); }
        .ringkas h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.85; }
        .ringkas .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
        .ringkas .grid div small { display: block; font-size: 9px; opacity: 0.8; text-transform: uppercase; font-weight: 700; margin-bottom: 3px; }
        .ringkas .grid div strong { font-size: 15px; color: #fff212; }
        .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; -webkit-overflow-scrolling: touch; }
        .chip { flex: 0 0 auto; padding: 8px 14px; border-radius: 20px; background: #fff; color: #4b5563; font-size: 12px; font-weight: 700; border: 1px solid #e5e7eb; cursor: pointer; }
        .chip.active { background: #03754c; color: #fff212; border-color: #03754c; }
        .log-item { background: white; border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.03); display: flex; gap: 12px; align-items: flex-start; }
        .ikon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex: 0 0 38px; }
        .isi { flex: 1; min-width: 0; }
        .log-info { font-size: 13px; color: #1f2937; font-weight: 800; line-height: 1.35; }
        .log-sub { font-size: 11px; color: #6b7280; font-weight: 600; margin-top: 3px; word-break: break-word; }
        .log-date { font-size: 11px; color: #9ca3af; font-weight: 700; margin-top: 5px; }
        .kanan { text-align: right; flex: 0 0 auto; }
        .poin-plus { font-size: 13px; font-weight: 800; color: #047857; }
        .poin-min { font-size: 13px; font-weight: 800; color: #b45309; }
        .poin-netral { font-size: 12px; font-weight: 700; color: #9ca3af; }
        .badge { display: inline-block; margin-top: 4px; padding: 4px 8px; border-radius: 10px; font-size: 9px; font-weight: 800; color: white; text-transform: uppercase; }
        .bg-pending { background-color: #f59e0b; } .bg-approved { background-color: #10b981; } .bg-rejected { background-color: #ef4444; } .bg-info { background-color: #6366f1; } .bg-duplikat { background-color: #6b7280; }
        .back-btn { display: block; text-align: center; margin-top: 20px; color: #03754c; text-decoration: none; font-weight: 700; background: #e5e7eb; padding: 15px; border-radius: 12px; }
        .kosong { text-align: center; color: #6b7280; padding: 30px 16px; background: white; border-radius: 16px; font-weight: 600; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header"><i class="fa-solid fa-clock-rotate-left"></i> RIWAYAT AKTIVITAS</div>
    <div class="container">
        <div class="ringkas">
            <h4>Ringkasan Poin Ekosistem</h4>
            <div class="grid">
                <div><small>Kerja</small><strong id="s_kerja">-</strong></div>
                <div><small>Kreatif</small><strong id="s_kreatif">-</strong></div>
                <div><small>Konekta</small><strong id="s_konekta">-</strong></div>
                <div><small>Total</small><strong id="s_total">-</strong></div>
            </div>
        </div>
        <div class="chips" id="chips">
            <div class="chip active" data-kat="semua">Semua</div>
            <div class="chip" data-kat="kreatif">Lebah Kreatif</div>
            <div class="chip" data-kat="medsos">Interaksi Konten</div>
            <div class="chip" data-kat="perawatan">Perawatan</div>
            <div class="chip" data-kat="konekta">Konekta</div>
            <div class="chip" data-kat="pencairan">Pencairan</div>
        </div>
        <div id="list_riwayat"><div class="kosong"><i class="fa-solid fa-spinner fa-spin"></i> Membaca log perjalanan...</div></div>
    </div>
    <div class="container"><a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard</a></div>

    <script>
        const SUPABASE_URL = "https://hvbrskchlpemypawpqjn.supabase.co/rest/v1";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2YnJza2NobHBlbXlwYXdwcWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzYzNzksImV4cCI6MjA5MjUxMjM3OX0.0NCroyTHROeQ3SNKOTNZS1H1hxrGy5wGTLGWm5YdOdo";
        const H = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };

        let SEMUA = [];
        let FILTER = 'semua';

        const KAT = {
            kreatif:   { ikon: 'fa-brands fa-instagram', warna: '#fdf2f8', teks: '#be185d' },
            medsos:    { ikon: 'fa-solid fa-heart',       warna: '#eff6ff', teks: '#1d4ed8' },
            perawatan: { ikon: 'fa-solid fa-tools',       warna: '#f0fdf4', teks: '#047857' },
            konekta:   { ikon: 'fa-solid fa-handshake',   warna: '#fefce8', teks: '#a16207' },
            pencairan: { ikon: 'fa-solid fa-money-bill-transfer', warna: '#fff7ed', teks: '#c2410c' }
        };

        const STATUS = {
            approved: ['Disetujui', 'bg-approved'], 'Approved': ['Disetujui', 'bg-approved'],
            pending: ['Menunggu', 'bg-pending'], 'Pending': ['Menunggu', 'bg-pending'],
            rejected: ['Ditolak', 'bg-rejected'], 'Rejected': ['Ditolak', 'bg-rejected'],
            duplikat: ['Duplikat', 'bg-duplikat'],
            processed: ['Diproses', 'bg-info'], transferred: ['Ditransfer', 'bg-approved'],
            completed: ['Selesai', 'bg-approved']
        };

        async function ambil(path) {
            try {
                const res = await fetch(`${SUPABASE_URL}${path}`, { headers: H });
                if (!res.ok) return [];
                const data = await res.json();
                return Array.isArray(data) ? data : [];
            } catch (e) { return []; }
        }

        function badge(status) {
            const s = STATUS[status] || [status || 'Pending', 'bg-pending'];
            return `<span class="badge ${s[1]}">${s[0]}</span>`;
        }

        function rupiah(n) { return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }

        function waktu(ts) {
            if (!ts) return '-';
            const d = new Date(ts);
            if (isNaN(d)) return '-';
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' +
                   d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        window.onload = async function() {
            const user = JSON.parse(localStorage.getItem('lebah_kader_data') || 'null');
            if (!user) return window.location.href = "index.html";
            const nik = user.nik || '';
            const idk = user.id_kader || '';

            const [kader, sub, medsos, rawat, wd, konekta] = await Promise.all([
                ambil(`/master_kader?id_kader=eq.${encodeURIComponent(idk)}&select=saldo_poin,creative_balance,konekta_points`),
                ambil(`/submissions?user_nik=eq.${encodeURIComponent(nik)}&select=platform,link,status,points_awarded,created_at&order=created_at.desc&limit=60`),
                ambil(`/log_aktivitas_medsos?nik_kader=eq.${encodeURIComponent(nik)}&select=platform,postingan_url,jenis_aksi,poin_diberikan,status_validasi,created_at,tanggal_aksi&order=created_at.desc&limit=60`),
                ambil(`/log_perawatan?id_kader=eq.${encodeURIComponent(idk)}&select=jenis_perawatan,status,created_at&order=created_at.desc&limit=60`),
                ambil(`/withdrawals?id_kader=eq.${encodeURIComponent(idk)}&select=total_poin,rupiah,status,requested_at&order=requested_at.desc&limit=30`),
                ambil(`/konekta_history?user_id=eq.${encodeURIComponent(idk)}&select=activity,points,event_date,date&order=date.desc&limit=60`)
            ]);

            if (kader.length) {
                const k = kader[0];
                const total = (k.saldo_poin || 0) + (k.creative_balance || 0) + (k.konekta_points || 0);
                document.getElementById('s_kerja').innerText = Number(k.saldo_poin || 0).toLocaleString('id-ID');
                document.getElementById('s_kreatif').innerText = Number(k.creative_balance || 0).toLocaleString('id-ID');
                document.getElementById('s_konekta').innerText = Number(k.konekta_points || 0).toLocaleString('id-ID');
                document.getElementById('s_total').innerText = Number(total).toLocaleString('id-ID');
            }

            SEMUA = [];

            sub.forEach(r => SEMUA.push({
                kat: 'kreatif', ts: r.created_at,
                judul: `Upload konten ${(r.platform || 'sosmed').toUpperCase()}`,
                sub: r.link, status: r.status,
                poin: Number(r.points_awarded || 0),
                arah: ['approved', 'Approved'].includes(r.status) ? 'plus' : 'netral'
            }));

            medsos.forEach(r => SEMUA.push({
                kat: 'medsos', ts: r.created_at || r.tanggal_aksi,
                judul: `${(r.jenis_aksi || 'interaksi').toUpperCase()} konten ${(r.platform || 'sosmed').toUpperCase()}`,
                sub: r.postingan_url, status: r.status_validasi,
                poin: Number(r.poin_diberikan || 0), arah: 'plus'
            }));

            rawat.forEach(r => SEMUA.push({
                kat: 'perawatan', ts: r.created_at,
                judul: 'Lapor perawatan', sub: r.jenis_perawatan || '-',
                status: r.status, poin: String(r.status || '').toLowerCase() === 'approved' ? 10 : 0,
                arah: String(r.status || '').toLowerCase() === 'approved' ? 'plus' : 'netral'
            }));

            konekta.forEach(r => SEMUA.push({
                kat: 'konekta', ts: r.date || r.event_date,
                judul: 'Kegiatan Konekta', sub: r.activity || '-',
                status: 'approved', poin: Number(r.points || 0), arah: 'plus'
            }));

            wd.forEach(r => SEMUA.push({
                kat: 'pencairan', ts: r.requested_at,
                judul: 'Pencairan poin', sub: rupiah(r.rupiah),
                status: r.status, poin: Number(r.total_poin || 0), arah: 'min'
            }));

            SEMUA.sort((a, b) => new Date(b.ts || 0) - new Date(a.ts || 0));
            render();
        };

        function render() {
            const list = document.getElementById('list_riwayat');
            const rows = SEMUA.filter(r => FILTER === 'semua' || r.kat === FILTER);
            if (!rows.length) {
                list.innerHTML = `<div class="kosong">Belum ada aktivitas pada kategori ini.</div>`;
                return;
            }
            list.innerHTML = rows.map(r => {
                const k = KAT[r.kat];
                const poinTxt = r.arah === 'min' ? `-${r.poin}` : (r.poin > 0 ? `+${r.poin}` : '0');
                const cls = r.arah === 'min' ? 'poin-min' : (r.poin > 0 ? 'poin-plus' : 'poin-netral');
                const subTxt = r.sub ? String(r.sub).replace(/^https?:\/\//, '').slice(0, 60) : '-';
                return `<div class="log-item">
                    <div class="ikon" style="background:${k.warna}; color:${k.teks};"><i class="${k.ikon}"></i></div>
                    <div class="isi">
                        <div class="log-info">${r.judul}</div>
                        <div class="log-sub">${subTxt}</div>
                        <div class="log-date"><i class="fa-regular fa-calendar"></i> ${waktu(r.ts)}</div>
                    </div>
                    <div class="kanan">
                        <div class="${cls}">${poinTxt}</div>
                        ${badge(r.status)}
                    </div>
                </div>`;
            }).join('');
        }

        document.getElementById('chips').addEventListener('click', function(e) {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            FILTER = chip.dataset.kat;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            render();
        });
    </script>
</body>
</html>
