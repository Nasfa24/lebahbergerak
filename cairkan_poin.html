<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lebah Bergerak - Cairkan Poin</title>
    
    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f41d.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #03754c; --secondary: #FF9c08; --accent: #fff212; --bg: #f3f4f6; --surface: #ffffff; --text: #1f2937; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; -webkit-tap-highlight-color: transparent; }
        
        .app-header { background-color: var(--primary); color: var(--accent); padding: 15px 20px; text-align: center; font-size: 18px; font-weight: 800; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 12px rgba(3, 117, 76, 0.2); display: flex; justify-content: space-between; align-items: center; }
        .btn-back { color: #ffffff; font-size: 14px; cursor: pointer; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 6px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3); }
        
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        
        .form-card { background-color: var(--surface); border-radius: 24px; padding: 30px 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); border: 1px solid #f3f4f6; }
        
        /* WALLET CARD DESIGN */
        .saldo-box { background: linear-gradient(135deg, #FFB75E, #ED8F03); color: white; padding: 25px 20px; border-radius: 20px; text-align: center; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(237, 143, 3, 0.3); position: relative; overflow: hidden;}
        .saldo-box::before { content:''; position: absolute; top:-50px; right:-50px; width:150px; height:150px; background:rgba(255,255,255,0.1); border-radius:50%; }
        .saldo-box h4 { margin-bottom: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; opacity: 0.9;}
        .saldo-box h1 { font-size: 42px; font-weight: 800; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.2); line-height: 1; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; color: var(--text); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 15px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; background-color: #f9fafb; transition: 0.3s; color: var(--text); }
        input:focus, select:focus { outline: none; border-color: var(--primary); background-color: #ffffff; box-shadow: 0 0 0 4px rgba(3, 117, 76, 0.1); }
        
        .btn-submit { background-color: var(--primary); color: var(--accent); font-size: 16px; padding: 18px; width: 100%; border: none; border-radius: 16px; font-weight: 800; margin-top: 15px; text-transform: uppercase; cursor: pointer; box-shadow: 0 8px 20px rgba(3, 117, 76, 0.3); letter-spacing: 1px; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap:10px; }
        .btn-submit:active { transform: scale(0.97); }
        .btn-submit:disabled { background-color: #9ca3af; cursor: not-allowed; box-shadow: none; transform: none; color: #f3f4f6;}
    </style>
</head>
<body>

    <div class="app-header">
        <div class="btn-back" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-arrow-left"></i> Kembali</div>
        <div>TARIK POIN</div>
        <div style="width: 85px;"></div> 
    </div>

    <div class="container">
        <div class="form-card">
            <div class="saldo-box">
                <h4>Saldo Aktif (Kerja)</h4>
                <h1 id="display_saldo"><i class="fa-solid fa-spinner fa-spin" style="font-size:30px;"></i></h1>
                <p style="font-size: 12px; margin-top: 8px; opacity: 0.8; font-weight: 600;">1 Poin = Reward Logistik</p>
            </div>
            
            <form id="formWithdraw">
                <input type="hidden" id="saldo_maksimal">

                <div class="form-group">
                    <label>Jumlah Poin yang Dicairkan</label>
                    <input type="number" id="poin_dicairkan" name="poin_dicairkan" required placeholder="Contoh: 200" min="200">
                    <span style="font-size: 11px; color: #ef4444; margin-top: 4px; display: block; font-weight: 600;">*Minimal pencairan 200 Poin.</span>
                </div>

                <div class="form-group">
                    <label>Metode Penarikan</label>
                    <select id="metode_bayar" name="metode_bayar" required>
                        <option value="">-- Pilih Bank / E-Wallet --</option>
                        <option value="BCA">Bank BCA</option>
                        <option value="Mandiri">Bank Mandiri</option>
                        <option value="BRI">Bank BRI</option>
                        <option value="BNI">Bank BNI</option>
                        <option value="BSI">Bank BSI</option>
                        <option value="GoPay">GoPay</option>
                        <option value="OVO">OVO</option>
                        <option value="DANA">DANA</option>
                        <option value="ShopeePay">ShopeePay</option>
                        <option value="Tunai">Tunai (Ambil di Posko)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nomor Rekening / No. E-Wallet</label>
                    <input type="number" id="nomor_rekening" name="nomor_rekening" required placeholder="Ketik nomor tujuan dengan benar">
                </div>

                <div class="form-group">
                    <label>Nama Pemilik Rekening</label>
                    <input type="text" id="atas_nama" name="atas_nama" required placeholder="Sesuai buku tabungan / aplikasi">
                </div>

                <button type="submit" class="btn-submit" id="btn-wd-submit">
                    <i class="fa-solid fa-money-bill-transfer"></i> Ajukan Pencairan
                </button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hvbrskchlpemypawpqjn.supabase.co/rest/v1";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2YnJza2NobHBlbXlwYXdwcWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzYzNzksImV4cCI6MjA5MjUxMjM3OX0.0NCroyTHROeQ3SNKOTNZS1H1hxrGy5wGTLGWm5YdOdo"; 
        const headersConfig = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

        window.onload = async function() {
            const kaderData = localStorage.getItem('lebah_kader_data');
            if(!kaderData) return window.location.href = "index.html";
            const user = JSON.parse(kaderData);
            
            try {
                const res = await fetch(`${SUPABASE_URL}/master_kader?id_kader=eq.${user.id_kader}&select=saldo_poin`, { headers: headersConfig });
                const data = await res.json();
                
                if(data.length > 0) {
                    const saldoReal = data[0].saldo_poin || 0;
                    document.getElementById('display_saldo').innerText = saldoReal;
                    document.getElementById('saldo_maksimal').value = saldoReal; 
                    
                    if(saldoReal < 200) {
                        Swal.fire({ icon: 'warning', title: 'Saldo Belum Cukup', text: 'Minimal 200 Poin untuk pencairan. Terus semangat memetakan suara!', confirmButtonColor: '#03754c' })
                        .then(() => { window.location.href = "dashboard.html"; });
                    }
                }
            } catch(err) {
                Swal.fire('Error', 'Gagal memuat saldo dari server.', 'error').then(()=> window.location.href="dashboard.html");
            }
        };

        document.getElementById('formWithdraw').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-wd-submit');
            
            const poinDiminta = parseInt(document.getElementById('poin_dicairkan').value);
            const saldoMaksimal = parseInt(document.getElementById('saldo_maksimal').value);

            if(poinDiminta < 200) return Swal.fire({ icon: 'error', title: 'Minimal 200 Poin', confirmButtonColor: '#FF9c08' });
            if(poinDiminta > saldoMaksimal) return Swal.fire({ icon: 'error', title: 'Saldo Tidak Cukup', text: `Maksimal pencairan Anda: ${saldoMaksimal} Poin.`, confirmButtonColor: '#FF9c08' });

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
            
            const user = JSON.parse(localStorage.getItem('lebah_kader_data'));
            
            const payload = {
                id_kader: user.id_kader,
                poin_dicairkan: poinDiminta,
                metode_bayar: document.getElementById('metode_bayar').value,
                nomor_rekening: document.getElementById('nomor_rekening').value,
                atas_nama: document.getElementById('atas_nama').value,
                status: "Pending"
            };

            try {
                const res = await fetch(`${SUPABASE_URL}/log_pencairan`, { method: 'POST', headers: headersConfig, body: JSON.stringify(payload) });
                if(!res.ok) throw new Error('Failed');
                
                await Swal.fire({ icon: 'success', title: 'Pengajuan Berhasil!', text: 'Tim logistik akan memproses pencairan ke rekening tujuan Anda secepatnya.', confirmButtonColor: '#03754c' });
                window.location.href = "dashboard.html";
            } catch (error) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-money-bill-transfer"></i> Ajukan Pencairan';
                Swal.fire({ icon: 'error', title: 'Gangguan Jaringan', text: 'Gagal mengirim pengajuan.', confirmButtonColor: '#FF9c08' });
            }
        });
    </script>
</body>
</html>
